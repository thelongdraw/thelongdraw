<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — The Long Draw</title>
  <meta name="description" content="The full collection. Things worth carrying." />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="nav-root"></div>

  <div class="page-header">
    <h1>The collection</h1>
    <p>Every product chosen by hand. If it doesn't belong in the same jacket pocket, it doesn't belong here.</p>
  </div>

  <section class="section" style="border-bottom:none;">
    <div class="product-grid" id="product-grid">
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
      <div class="product-skeleton"></div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../js/layout.js"></script>
  <script src="../js/shopify.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('nav-root').innerHTML = getNavHTML('../');
    document.getElementById('footer-root').innerHTML = getFooterHTML('../');

    async function loadAll() {
      const grid = document.getElementById('product-grid');
      try {
        const products = await getProducts(24);
        if (!products.length) { grid.innerHTML = '<p style="padding:2rem;color:#6b6760;font-size:14px;grid-column:1/-1;">Products coming soon.</p>'; return; }
        grid.innerHTML = products.map(p => {
          const img = p.images.edges[0]?.node.url;
          const price = p.priceRange.minVariantPrice;
          return `<a href="product.html?handle=${p.handle}" class="product-card">
            ${img ? `<img class="product-img" src="${img}" alt="${p.title}" />` : '<div class="product-img-placeholder">No image</div>'}
            <p class="product-name">${p.title}</p>
            <p class="product-vendor">${p.vendor || ''}</p>
            <p class="product-price">${formatPrice(price.amount, price.currencyCode)}</p>
          </a>`;
        }).join('');
      } catch(e) {
        grid.innerHTML = '<p style="padding:2rem;color:#6b6760;font-size:14px;grid-column:1/-1;">Could not load products.</p>';
      }
    }
    loadAll();
  </script>
</body>
</html>
