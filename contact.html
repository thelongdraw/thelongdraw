<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Long Draw</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="nav-root"></div>

  <div class="contact-wrap">
    <div class="contact-info">
      <h1>Get in touch.</h1>
      <p>Questions about an order, a product, or just want to talk about good things? We're here. Real replies, no automation.</p>
      <div class="contact-detail">
        <p>Email</p>
        <a href="mailto:contact@thelongdraw.com">contact@thelongdraw.com</a>
      </div>
      <div class="contact-detail" style="margin-top:1.5rem;">
        <p>Follow</p>
        <a href="https://instagram.com/thelongdraw" target="_blank">@thelongdraw</a>
      </div>
    </div>
    <div class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="Order inquiry, product question, etc." />
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="What's on your mind?"></textarea>
      </div>
      <button class="btn btn-solid" onclick="handleSubmit()">Send message &rarr;</button>
      <p class="form-msg" id="form-msg"></p>
    </div>
  </div>

  <div id="footer-root"></div>

  <script src="../js/layout.js"></script>
  <script src="../js/shopify.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('nav-root').innerHTML = getNavHTML('../');
    document.getElementById('footer-root').innerHTML = getFooterHTML('../');

    function handleSubmit() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const msg = document.getElementById('form-msg');
      if (!name || !email || !message) {
        msg.textContent = 'Please fill in all fields.';
        msg.style.display = 'block';
        return;
      }
      msg.textContent = "Message sent. We'll be in touch.";
      msg.style.display = 'block';
      ['name','email','subject','message'].forEach(id => document.getElementById(id).value = '');
    }
  </script>
</body>
</html>
