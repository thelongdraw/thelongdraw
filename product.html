<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — The Long Draw</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <div id="nav-root"></div>
  <a href="shop.html" class="back-link">&larr; Back to shop</a>
  <div id="product-content">
    <div class="product-page">
      <div class="product-page-images" style="align-items:center;justify-content:center;">
        <div class="product-skeleton" style="width:100%;max-width:400px;aspect-ratio:1;"></div>
      </div>
      <div class="product-page-info">
        <div class="product-skeleton" style="height:14px;width:40%;margin-bottom:1rem;"></div>
        <div class="product-skeleton" style="height:36px;width:70%;margin-bottom:1rem;"></div>
        <div class="product-skeleton" style="height:24px;width:20%;margin-bottom:2rem;"></div>
        <div class="product-skeleton" style="height:120px;width:100%;margin-bottom:1.5rem;"></div>
        <div class="product-skeleton" style="height:48px;width:100%;"></div>
      </div>
    </div>
  </div>
  <div id="footer-root"></div>

  <script src="../js/layout.js"></script>
  <script src="../js/shopify.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('nav-root').innerHTML = getNavHTML('../');
    document.getElementById('footer-root').innerHTML = getFooterHTML('../');

    const handle = new URLSearchParams(window.location.search).get('handle');
    let selectedVariantId = null;

    async function loadProduct() {
      if (!handle) { document.getElementById('product-content').innerHTML = '<p style="padding:4rem 2.5rem;">Product not found.</p>'; return; }
      try {
        const p = await getProduct(handle);
        if (!p) { document.getElementById('product-content').innerHTML = '<p style="padding:4rem 2.5rem;">Product not found.</p>'; return; }

        document.title = `${p.title} — The Long Draw`;
        const images = p.images.edges.map(e => e.node);
        const variants = p.variants.edges.map(e => e.node);
        selectedVariantId = variants[0]?.id;

        const mainImg = images[0]?.url;
        const thumbs = images.slice(1);

        document.getElementById('product-content').innerHTML = `
          <div class="product-page">
            <div class="product-page-images">
              ${mainImg ? `<img id="main-img" src="${mainImg}" alt="${p.title}" />` : '<div style="width:100%;aspect-ratio:1;background:var(--gray-light);"></div>'}
              ${thumbs.length ? `<div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.5rem;">
                ${thumbs.map(img => `<img src="${img.url}" alt="${p.title}" style="width:72px;height:72px;object-fit:cover;cursor:pointer;border:1px solid var(--border);" onclick="document.getElementById('main-img').src='${img.url}'" />`).join('')}
              </div>` : ''}
            </div>
            <div class="product-page-info">
              ${p.vendor ? `<p class="product-page-vendor">${p.vendor}</p>` : ''}
              <h1>${p.title}</h1>
              <p class="product-page-price">${formatPrice(variants[0].price.amount, variants[0].price.currencyCode)}</p>
              ${p.description ? `<p class="product-page-desc">${p.description}</p>` : ''}
              ${variants.length > 1 ? `
                <p class="variant-label">Options</p>
                <select class="variant-select" id="variant-select" onchange="handleVariantChange(this)">
                  ${variants.map(v => `<option value="${v.id}" data-price="${v.price.amount}" data-currency="${v.price.currencyCode}" ${!v.availableForSale ? 'disabled' : ''}>${v.title}${!v.availableForSale ? ' — Sold out' : ''}</option>`).join('')}
                </select>` : ''}
              <button class="btn btn-solid btn-full" id="add-to-cart-btn" onclick="handleAddToCart(selectedVariantId)">Add to cart</button>
              <div class="product-meta">
                Free shipping on orders over $75<br>
                Patina welcome &mdash; Built to last
              </div>
            </div>
          </div>`;
      } catch(e) {
        document.getElementById('product-content').innerHTML = '<p style="padding:4rem 2.5rem;">Could not load product.</p>';
      }
    }

    function handleVariantChange(sel) {
      selectedVariantId = sel.value;
      const opt = sel.options[sel.selectedIndex];
      const price = document.querySelector('.product-page-price');
      if (price) price.textContent = formatPrice(opt.dataset.price, opt.dataset.currency);
    }

    loadProduct();
  </script>
</body>
</html>
