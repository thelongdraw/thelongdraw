<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — The Long Draw</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-logo">The Long Draw</a>
    <div class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="nav-cart" id="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </nav>

  <div class="contact-section">
    <h1>Get in touch</h1>
    <p>Questions about an order, a product, or just want to talk about good things? We're here. Real replies, no automation.</p>

    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" placeholder="What's on your mind?"></textarea>
    </div>
    <button class="btn btn-solid" onclick="handleSubmit()">Send message &rarr;</button>
    <p id="form-msg" style="font-size:13px;color:#6b6760;margin-top:1rem;display:none;"></p>

    <div style="margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);">
      <p style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:#b0aca3;margin-bottom:0.75rem;">Direct</p>
      <a href="mailto:contact@thelongdraw.com" style="font-size:15px;color:#1a1815;">contact@thelongdraw.com</a>
    </div>
  </div>

  <footer class="footer" style="border-top:1px solid var(--border);margin-top:4rem;">
    <span class="footer-logo">The Long Draw</span>
    <div class="footer-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="https://instagram.com/thelongdraw" target="_blank">Instagram</a>
    </div>
    <span class="footer-copy">&copy; 2025 The Long Draw</span>
  </footer>

  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <span class="cart-title">Your cart</span>
      <button class="cart-close" id="cart-close">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer"></div>
  </div>
  <div class="cart-overlay" id="cart-overlay"></div>

  <script src="../js/shopify.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    function handleSubmit() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      const msg = document.getElementById('form-msg');
      if (!name || !email || !message) {
        msg.textContent = 'Please fill in all fields.';
        msg.style.display = 'block';
        return;
      }
      msg.textContent = "Message sent. We'll be in touch.";
      msg.style.display = 'block';
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('message').value = '';
    }
  </script>
</body>
</html>
