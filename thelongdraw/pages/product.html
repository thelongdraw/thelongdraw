<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — The Long Draw</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="../index.html" class="nav-logo">The Long Draw</a>
    <div class="nav-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="nav-cart" id="cart-btn" aria-label="Cart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      <span class="cart-count" id="cart-count">0</span>
    </button>
  </nav>

  <div id="product-content">
    <div style="padding:4rem 2.5rem;color:#6b6760;font-size:14px;">Loading...</div>
  </div>

  <footer class="footer">
    <span class="footer-logo">The Long Draw</span>
    <div class="footer-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <span class="footer-copy">&copy; 2025 The Long Draw</span>
  </footer>

  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <span class="cart-title">Your cart</span>
      <button class="cart-close" id="cart-close">&times;</button>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-footer" id="cart-footer"></div>
  </div>
  <div class="cart-overlay" id="cart-overlay"></div>

  <script src="../js/shopify.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const handle = params.get('handle');

    async function loadProduct() {
      const container = document.getElementById('product-content');
      if (!handle) {
        container.innerHTML = '<p style="padding:4rem 2.5rem;">Product not found.</p>';
        return;
      }
      try {
        const product = await getProduct(handle);
        if (!product) {
          container.innerHTML = '<p style="padding:4rem 2.5rem;">Product not found.</p>';
          return;
        }
        document.title = `${product.title} — The Long Draw`;
        const img = product.images.edges[0]?.node.url;
        const variants = product.variants.edges.map(e => e.node);
        const defaultVariant = variants[0];

        container.innerHTML = `
          <div style="padding: 1.5rem 2.5rem; border-bottom: 1px solid var(--border);">
            <a href="shop.html" class="back-link">&larr; Back to shop</a>
          </div>
          <div class="product-page">
            <div class="product-page-img">
              ${img ? `<img src="${img}" alt="${product.title}" />` : '<div style="width:100%;aspect-ratio:1;background:var(--gray-light);"></div>'}
            </div>
            <div class="product-page-info">
              <h1>${product.title}</h1>
              <p class="product-page-price">${formatPrice(defaultVariant.price.amount, defaultVariant.price.currencyCode)}</p>
              <p class="product-page-desc">${product.description || ''}</p>
              ${variants.length > 1 ? `
                <select class="variant-select" id="variant-select">
                  ${variants.map(v => `<option value="${v.id}" ${!v.availableForSale ? 'disabled' : ''}>${v.title}${!v.availableForSale ? ' — Sold out' : ''}</option>`).join('')}
                </select>
              ` : ''}
              <button class="btn btn-solid" id="add-to-cart-btn" style="width:100%;" onclick="handleAddToCart(getSelectedVariant())">
                Add to cart
              </button>
              <p style="font-size:12px;color:var(--gray-mid);margin-top:1rem;letter-spacing:0.04em;">Free shipping on orders over $75. Patina welcome.</p>
            </div>
          </div>
        `;
      } catch(e) {
        container.innerHTML = '<p style="padding:4rem 2.5rem;">Could not load product.</p>';
      }
    }

    function getSelectedVariant() {
      const sel = document.getElementById('variant-select');
      if (sel) return sel.value;
      const params = new URLSearchParams(window.location.search);
      const handle = params.get('handle');
      return window._defaultVariantId;
    }

    loadProduct().then(() => {
      const variants = document.querySelectorAll('#variant-select option');
      if (variants.length) window._defaultVariantId = variants[0].value;
    });
  </script>
</body>
</html>
